<text x="70" y="790" class="small" text-anchor="start">REDES DE ALIMENTAÇÃO</text>
<text x="70" y="828" class="small" text-anchor="start">+5V_USB: USB do ESP32 e VCC do HC-SR04.</text>
<text x="70" y="863" class="small" text-anchor="start">+3V3: saída 3V3 do ESP32 e VCC do HX711.</text>
<text x="70" y="898" class="small" text-anchor="start">Todos os símbolos GND são interligados.</text>
<text x="70" y="947" class="small" text-anchor="start">ECHO: 5 × 2 / (1 + 2) ≈ 3,33 V</text>
<text x="70" y="981" class="small" text-anchor="start">R1 e R2: 1/4 W, tolerância de 1%.</text>
<line x1="70" y1="1082" x2="1630" y2="1082" stroke="#d4dfe2" stroke-width="2"/>
<text x="70" y="1114" class="note" text-anchor="start">Montagem: confirme o pino de 5 V ligado à USB na sua placa; não presuma que qualquer pino VIN fornece 5 V.</text>
<text x="70" y="1147" class="note" text-anchor="start">HX711: módulo compatível com 3,3 V. Célula: siga E+/E− e sinal +/− do fabricante; as cores dos fios podem variar.</text>
<text x="70" y="1180" class="small" text-anchor="start">Base: apresentação EcoBin, slide 5. Leitura real, tara e calibração ainda precisam ser adicionadas ao firmware.</text>
